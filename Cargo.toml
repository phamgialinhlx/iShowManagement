[workspace]
resolver = "3"
members = [
    "crates/zmux-transport",
    "crates/zmux-ssh",
    "crates/zmuxd",
    "crates/zmux-fs",
    "crates/zmux-git",
    "crates/zmux-term",
    "crates/zmux-claude",
    "crates/zmux-app",
    "askpass",
]
# The vendored Zed presentation stack is its own workspace (its crates use
# `workspace = true` inheritance against Zed's manifest). `references/` is a
# read-only Zed checkout. Neither may be absorbed as members of this workspace.
exclude = ["vendor/zed", "references"]

[workspace.package]
version = "0.2.17"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/phamgialinhlx/iShowManagement"

[workspace.dependencies]
# --- internal ---
zmux-transport = { path = "crates/zmux-transport" }
zmux-ssh = { path = "crates/zmux-ssh" }
zmux-fs = { path = "crates/zmux-fs" }
zmux-git = { path = "crates/zmux-git" }
zmux-term = { path = "crates/zmux-term" }
zmux-claude = { path = "crates/zmux-claude" }
zmuxd = { path = "crates/zmuxd" }

# --- async / runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"

# --- errors / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The theme config is a human-facing file, so TOML rather than JSON.
toml = "0.8"
# Watches theme.toml so an external hand-edit repaints the running app.
notify = "6"
prost = "0.14"
prost-build = "0.14"
bytes = "1"

# --- terminal ---
# Pinned exactly: alacritty_terminal offers no stability guarantee across minor versions.
alacritty_terminal = "=0.26.0"
portable-pty = "0.9"

# --- system / metrics ---
sysinfo = "0.39"

# --- network / http ---
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# --- browser automation (CDP) ---
chromiumoxide = { version = "0.9", default-features = false, features = [
    "tokio-runtime",
] }

# --- credentials ---
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

# --- ssh (Windows fallback only; macOS/Linux shell out to the system ssh binary) ---
russh = "0.62"

# --- lock (PIN-sealed session vault) ---
# argon2id because a PIN is a tiny secret: the only thing standing between four
# digits and the session is how expensive each guess is to make.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"

# --- misc ---
camino = { version = "1", features = ["serde1"] }
dirs = "6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

# Required by the vendored gpui: it depends on these upstream forks. `[patch]`
# only takes effect from the true build root, which is this workspace.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The remote agent is uploaded over the wire on every version bump, so size matters
# more than anything else about it.
[profile.agent-release]
inherits = "release"
opt-level = "z"
