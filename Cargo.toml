[workspace]
resolver = "3"
members = [
    "crates/rmux-proto",
    "crates/rmux-transport",
    "crates/rmux-ssh",
    "crates/rmux-agent",
    "crates/rmux-fs",
    "crates/rmux-git",
    "crates/rmux-term",
    "crates/rmux-claude",
    "crates/rmux-claude-core",
    "crates/rmux-metrics",
    "crates/rmux-control",
    "crates/rmux-bridge",
    "crates/rmux-cowork",
    "crates/rmux-core",
    "crates/rmux-app",
    "crates/rmux-web",
    "askpass",
    "src-tauri",
]

[workspace.package]
version = "0.2.28"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ngocanhnckh/rmux"

[workspace.dependencies]
# --- internal ---
rmux-proto = { path = "crates/rmux-proto" }
rmux-transport = { path = "crates/rmux-transport" }
rmux-ssh = { path = "crates/rmux-ssh" }
rmux-fs = { path = "crates/rmux-fs" }
rmux-git = { path = "crates/rmux-git" }
rmux-term = { path = "crates/rmux-term" }
rmux-claude = { path = "crates/rmux-claude" }
rmux-claude-core = { path = "crates/rmux-claude-core" }
rmux-agent = { path = "crates/rmux-agent" }
rmux-metrics = { path = "crates/rmux-metrics" }
rmux-control = { path = "crates/rmux-control" }
rmux-bridge = { path = "crates/rmux-bridge" }
rmux-cowork = { path = "crates/rmux-cowork" }
rmux-core = { path = "crates/rmux-core" }
rmux-app = { path = "crates/rmux-app" }

# --- async / runtime ---
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"

# --- errors / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The theme config is a human-facing file, so TOML rather than JSON.
toml = "0.8"
# Watches theme.toml so an external hand-edit repaints the running app.
notify = "6"
prost = "0.14"
prost-build = "0.14"
bytes = "1"

# --- terminal ---
# Pinned exactly: alacritty_terminal offers no stability guarantee across minor versions.
alacritty_terminal = "=0.26.0"
portable-pty = "0.9"

# --- system / metrics ---
sysinfo = "0.39"

# --- network / http ---
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# The bridge's outbound WebSocket. `rustls` and not native TLS: the agent is a
# *static musl* binary uploaded to hosts we know nothing about, and linking
# OpenSSL would reintroduce exactly the shared-library dependency that static
# linking exists to avoid. `webpki-roots` and not the platform store for the
# same reason — a minimal container frequently has no CA bundle at all, and
# "works on my Debian box, fails in the Alpine one" is not a failure mode worth
# shipping.
tokio-tungstenite = { version = "0.28", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
# **Named explicitly, with a provider.** tokio-tungstenite 0.28 pulls `rustls`
# with only the `std` feature and deliberately leaves the crypto backend to the
# consumer — so a config built without this compiles cleanly and then *panics at
# runtime* with "no process-level CryptoProvider available". On a host, over
# ssh, that is a bridge that dies the moment it dials. `ring` rather than
# `aws-lc-rs` because it is the one that cross-compiles to all three agent
# targets under zig.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# --- browser automation (CDP) ---
chromiumoxide = { version = "0.9", default-features = false, features = [
    "tokio-runtime",
] }

# --- credentials ---
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

# --- ssh (Windows fallback only; macOS/Linux shell out to the system ssh binary) ---
russh = "0.62"

# --- lock (PIN-sealed session vault) ---
# argon2id because a PIN is a tiny secret: the only thing standing between four
# digits and the session is how expensive each guess is to make.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"

# --- misc ---
camino = { version = "1", features = ["serde1"] }
dirs = "6"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# **`unwind`, and this reverses an earlier deliberate choice.** `abort` was
# right about rmux's *own* panics — a bug should stop the process rather than
# limp on with half a subsystem dead — and that is still what happens, because
# `logs::route_panics_to_log` runs from the panic hook either way.
#
# What `abort` also did was break a dependency's *handled* error path. Tauri
# serves the whole UI over a custom URL scheme; when the webview stops a task
# that is still being answered, `WKURLSchemeTask::didFinish` raises an
# `NSException`. wry knows this and wraps the call in `objc2::exception::catch`
# — but that exception has to cross a Rust `extern "C"` frame to get there, and
# under `panic = "abort"` the frame is `nounwind`, so it reaches
# `panic_cannot_unwind` and calls `abort()` instead of being caught. The guard
# written to survive the race is disabled by our own profile.
#
# Measured before the change: five identical SIGABRTs in one day, every one on
# a `tokio-rt-worker` with `didFinish` under `objc2::exception::catch` in the
# stack, and the rate climbing (1–3/day since 16 Aug, 5 on the 28th, 6 on the
# 29th). The baseline is what makes the change checkable.
panic = "unwind"
# **`debuginfo`, not `true`.** `strip = true` removes the symbol *table* as well,
# so a macOS crash report against a shipped build symbolicates to nothing at all
# — which is exactly what happened: a reproducible panic, two crash reports, and
# no way to name a single frame. Keeping the symbol table costs about 1 MB in
# the binary and no runtime, and turns an unattributable abort into a stack.
strip = "debuginfo"

# The remote agent is uploaded over the wire on every version bump, so size matters
# more than anything else about it.
[profile.agent-release]
inherits = "release"
opt-level = "z"

# **tao, patched: an Objective-C exception during event dispatch is caught and
# logged instead of aborting the app.** tao overrides `-[NSApplication
# sendEvent:]` with an `extern "C"` function, so any `NSException` AppKit or
# WebKit raises while delivering a click or keystroke has to unwind through a
# frame that cannot be unwound — `panic_cannot_unwind`, SIGABRT, and nothing in
# `rmux.log` but "panic in a function that cannot unwind" (the hook never sees
# a foreign exception, so it cannot name it). Measured: two such aborts in ~15h
# on 0.2.26, both on the main thread under `tao::…::app::send_event`. A stock
# Cocoa app's run loop catches and logs these and keeps going; the patch
# (`vendor/tao/src/platform_impl/macos/app.rs`, `dispatch_catching`) restores
# that and logs the exception's name and reason. Drop it when upstream tao
# catches there itself; re-apply when bumping tao.
[patch.crates-io]
tao = { path = "vendor/tao" }
