[package]
name = "rmux-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rmux in a browser: the same UI and the same command table, served from a dev host"

# **No `tauri`, in any form.** This binary is cross-compiled to
# x86_64-unknown-linux-musl with cargo-zigbuild and runs headless on a dev host.
# It reaches commands only through rmux-app's public API.
[[bin]]
name = "rmux-web"
path = "src/main.rs"

[dependencies]
rmux-app.workspace = true

anyhow.workspace = true
# Cloudflare Access: the JWKS fetch, and RS256 verification with `ring` (already
# in the tree through rustls, and it cross-compiles to musl under zig).
base64.workspace = true
reqwest.workspace = true
ring = "0.17"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "ws",
] }
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
tokio.workspace = true
tokio-util.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { workspace = true }
