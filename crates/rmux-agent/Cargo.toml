[package]
name = "rmux-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rmux_agent"
path = "src/lib.rs"

[[bin]]
name = "rmux-agent"
path = "src/main.rs"

[dependencies]
rmux-bridge.workspace = true
# `fs-serve` — the worktree snapshot, watcher and file operations.
rmux-fs.workspace = true
rmux-term.workspace = true
rmux-claude-core.workspace = true
rmux-transport.workspace = true

anyhow.workspace = true
base64.workspace = true
camino.workspace = true
dirs.workspace = true
notify.workspace = true
parking_lot.workspace = true
futures.workspace = true
# `rmux wait-output --regex`. Default features off: the agent is uploaded to
# every host, and Unicode tables beyond Perl classes and case folding would be
# paid for on the wire for nothing a terminal search needs.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rmux-ssh.workspace = true
