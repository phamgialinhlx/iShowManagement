[package]
name = "zmux-app"
version = "0.2.17"
edition = "2024"
publish = false

[[bin]]
name = "zmux"
path = "src/main.rs"

[dependencies]
gpui = { path = "../../vendor/zed/crates/gpui" }
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", features = ["font-kit"] }
theme = { path = "../../vendor/zed/crates/theme" }
ui = { path = "../../vendor/zed/crates/ui" }
zmux-term.workspace = true
zmux-transport.workspace = true
zmux-ssh.workspace = true
zmuxd.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
log = "0.4"
parking_lot = "0.12"
