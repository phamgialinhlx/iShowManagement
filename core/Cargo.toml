[package]
name = "core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Library holds the server + all feature modules so the desktop shell can embed
# it. Named `ismcore` (not `core`) to avoid clashing with the std `core` crate.
[lib]
name = "ismcore"
path = "src/lib.rs"

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
anyhow = "1.0.104"
regex = "1.13.1"
aes-gcm = "0.11.0"
getrandom = "0.4.3"
dirs = "6.0.0"
glob = "0.3.3"
keyring = { version = "4.1.5", features = ["apple-native-keyring-store"] }
futures = "0.3.33"
tokio-util = { version = "0.7.19", features = ["io"] }
base64 = "0.22.1"
