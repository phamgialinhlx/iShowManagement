<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content`: on Chrome for Android the on-screen
      keyboard shrinks the layout viewport, so the fixed composer rides above it.
      Safari ignores it and is handled with `visualViewport` (`src/mobile/viewport.ts`).
      `viewport-fit=cover` so the safe-area insets are real numbers to pad by.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff1f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%2389b4fa%22/%3E%3C/svg%3E" />
    <title>rmux</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/mobile/main.tsx"></script>
  </body>
</html>
