<!doctype html>
<meta charset="utf-8">
<title>zoom semantics</title>
<style>
  html, body { height: 100%; margin: 0; font: 22px ui-monospace, monospace; background: #111; color: #eee; }
  #plain, #compensated { zoom: 1.09; }
  #plain { width: 100%; height: 100%; }
  #compensated { width: calc(100% / 1.09); height: calc(100% / 1.09); }
  .box { position: absolute; inset: 0; visibility: hidden; }
  #out { padding: 24px; line-height: 1.8; white-space: pre; }
</style>
<div class="box"><div id="plain"></div></div>
<div class="box"><div id="compensated"></div></div>
<div id="out">measuring…</div>
<script>
  const vw = window.innerWidth, vh = window.innerHeight;
  const p = document.getElementById('plain').getBoundingClientRect();
  const c = document.getElementById('compensated').getBoundingClientRect();
  const pct = (a, b) => (100 * a / b).toFixed(1) + '%';
  document.getElementById('out').textContent =
    `viewport            ${vw} x ${vh}\n` +
    `\n` +
    `zoom:1.09 width:100%          -> ${p.width.toFixed(0)} x ${p.height.toFixed(0)}   (${pct(p.width, vw)} of viewport)\n` +
    `zoom:1.09 width:calc(100%/z)  -> ${c.width.toFixed(0)} x ${c.height.toFixed(0)}   (${pct(c.width, vw)} of viewport)\n` +
    `\n` +
    `VERDICT: ` +
    (Math.abs(p.width - vw) < 2
      ? 'STANDARDISED zoom -> use width:100%, the calc is WRONG'
      : Math.abs(c.width - vw) < 2
        ? 'LEGACY zoom -> the calc compensation is RIGHT'
        : 'neither fills the viewport');
</script>
