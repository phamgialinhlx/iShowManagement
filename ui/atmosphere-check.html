<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>atmosphere flatness probe</title>
    <link rel="stylesheet" href="/src/styles/signal-room.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      #out {
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid rgba(232, 230, 225, 0.14);
        padding: 12px;
        white-space: pre;
        line-height: 1.6;
      }
      h1 {
        font: 600 13px ui-monospace, monospace;
        letter-spacing: 0.08em;
        margin: 0 0 4px;
      }
      p {
        max-width: 70ch;
        color: #a8a49c;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- The real element, so the probe reads the shipped rule rather than a copy. -->
    <div class="atmosphere"></div>

    <h1>ATMOSPHERE FLATNESS</h1>
    <p>
      Panels are translucent, so anything painted across the window shows through them. A
      vignette therefore does not sit <em>behind</em> the UI — it paints the edges of it,
      and the rails are the edges. This measures the backdrop where each surface stands and
      fails if they disagree.
    </p>
    <div id="out">running…</div>

    <script type="module">
      import { run } from "./atmosphere-check.ts";

      const out = document.getElementById("out");
      const lines = [];
      const log = (line) => {
        lines.push(line);
        out.textContent = lines.join("\n");
      };

      run(log)
        .then((ok) => {
          log("");
          log(ok ? "ALL CHECKS PASSED" : "CHECKS FAILED");
          out.style.borderColor = ok ? "rgba(94, 242, 176, 0.5)" : "#e63b2e";
        })
        .catch((e) => {
          log("");
          log("ERROR  " + (e && e.message ? e.message : String(e)));
          out.style.borderColor = "#e63b2e";
        });
    </script>
  </body>
</html>
