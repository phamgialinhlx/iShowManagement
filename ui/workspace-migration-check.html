<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>v2 → v3 workspace migration</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #0a0a0a;
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
      }
      #out {
        border: 1px solid rgba(232, 230, 225, 0.14);
        padding: 12px;
        white-space: pre;
        line-height: 1.7;
      }
      h1 {
        font: 600 13px ui-monospace, monospace;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <h1>WORKSPACE MIGRATION (v2 → v3)</h1>
    <div id="out">running…</div>
    <script type="module">
      import { run } from "./workspace-migration-check.ts";
      const out = document.getElementById("out");
      const lines = [];
      const log = (line) => {
        lines.push(line);
        out.textContent = lines.join("\n");
      };
      try {
        const ok = run(log);
        out.style.borderColor = ok ? "rgba(94, 242, 176, 0.5)" : "#e63b2e";
      } catch (e) {
        log("ERROR  " + (e && e.message ? e.message : String(e)));
        out.style.borderColor = "#e63b2e";
      }
    </script>
  </body>
</html>
