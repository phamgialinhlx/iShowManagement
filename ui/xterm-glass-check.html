<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>xterm glass probe</title>
    <style>
      /* Deliberately garish. A subtle backdrop hides exactly the failure this
         page exists to catch — an opaque terminal over a dark wallpaper looks
         identical to a transparent one. */
      body {
        margin: 0;
        padding: 16px;
        background: repeating-linear-gradient(45deg, #ff2d95 0 40px, #00e5ff 40px 80px, #ffe600 80px 120px);
        color: #e8e6e1;
        font: 12px ui-monospace, monospace;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .sheet {
        background: color-mix(in srgb, #0a0a0a 64%, transparent);
        backdrop-filter: blur(20px) saturate(1.5);
        -webkit-backdrop-filter: blur(20px) saturate(1.5);
        border: 1px solid rgba(232, 230, 225, 0.12);
        padding: 8px;
        height: 220px;
      }
      #out {
        grid-column: 1 / -1;
        background: rgba(0, 0, 0, 0.8);
        padding: 8px 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="sheet"><div id="dom" style="height: 100%"></div></div>
    <div class="sheet"><div id="gl" style="height: 100%"></div></div>
    <pre id="out">running…</pre>
    <script type="module" src="/xterm-glass-check.ts"></script>
  </body>
</html>
