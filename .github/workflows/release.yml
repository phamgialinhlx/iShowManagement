# Build and release the iShowManagement desktop app (macOS, universal binary).
#
# Trigger a release by pushing a version tag:
#     git tag v0.2.0 && git push origin v0.2.0
# That builds a universal .dmg (Apple Silicon + Intel) and publishes a GitHub
# Release with it attached. A manual "Run workflow" (workflow_dispatch) builds
# the same .dmg and uploads it as a run artifact, without creating a Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    # arm64 runner; we add the x86_64 target and lipo both into a universal binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Sync app version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' desktop/tauri.conf.json > "$tmp"
          mv "$tmp" desktop/tauri.conf.json
          echo "Set app version to $VER"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build desktop app (universal)
        working-directory: desktop
        # The Tauri CLI is a devDependency of web/, so invoke it from there.
        run: ../web/node_modules/.bin/tauri build --target universal-apple-darwin
        # --- Optional: code signing + notarization --------------------------
        # The app ships unsigned (users right-click → Open on first launch). To
        # sign + notarize instead, add these repo secrets and uncomment the env
        # block — Tauri picks them up automatically during the build:
        # env:
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                 # base64 of a Developer ID .p12
        #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}       # "Developer ID Application: NAME (TEAMID)"
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                       # an app-specific password
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect .dmg
        run: |
          mkdir -p dist
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Install (macOS)

            1. Download the `.dmg` below and drag **iShowManagement** into Applications.
            2. The app is unsigned, so the first launch is blocked by Gatekeeper —
               **right-click the app → Open**, then confirm. You only do this once.
