# Building rmux for the platforms this Mac cannot build.
#
# ## Why this exists rather than a cross-compile
#
# The *agent* cross-compiles cleanly — it is a plain binary, and
# `scripts/build-agents.sh` produces the Linux and Windows ones from macOS with
# zig. The **app** cannot. Tauri links against each platform's own webview:
# WebKitGTK on Linux, WebView2 on Windows, WKWebView on macOS. Those are native
# system libraries with native toolchains, and no amount of zig makes a Mac
# produce them. A build on the target OS is the only honest way to get one.
#
# ## The agents are built once, on macOS, and shared
#
# Every platform's app embeds the *same* Linux and Windows agent binaries — they
# are what gets uploaded to a host, so they have nothing to do with which machine
# the app runs on. Building them once and passing them along keeps every artifact
# carrying byte-identical agents; building them per-runner would give three
# fingerprints for one release, and a fingerprint is what decides whether a host
# starts a new daemon.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. rmux-v0.1.1)"
        required: true
  push:
    tags: ["rmux-v*"]

jobs:
  agents:
    name: cross-compile the agents
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # **The tag, not the branch a dispatch happened to run from.** On
      # `workflow_dispatch` the default checkout is whatever ref was selected in
      # the UI, while the artifacts are published under the `tag` input — so the
      # two can disagree, and a release can be assembled from code the tag does
      # not point at. That already happened here: `rmux-v0.1.1` names a commit
      # two fixes older than the branch that was built against it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zig and cargo-zigbuild
        run: |
          brew install zig
          cargo install cargo-zigbuild --locked
      - run: ./scripts/build-agents.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agents
          path: src-tauri/agents/
          retention-days: 1

  app:
    name: ${{ matrix.name }}
    needs: agents
    strategy:
      # One platform failing must not cancel the others: a Linux packaging
      # problem should still leave a usable Windows build to hand out.
      fail-fast: false
      # **One at a time, and that is not about runner cost.** `tauri-action`
      # creates the release when it cannot find one, so run together both jobs
      # look, both find nothing, and both create — the loser gets a 422 and
      # drops its installers on the floor. Serialising makes the first job the
      # one that opens the draft and the second the one that joins it. The price
      # is wall-clock: the two builds add up instead of overlapping.
      max-parallel: 1
      matrix:
        include:
          # macOS is deliberately absent. It is built, signed and notarised on
          # the developer's Mac by `scripts/release-mac.sh`, which has the
          # Developer ID certificate; CI does not, and `tauri-action` fails
          # trying to import one rather than falling back to unsigned — which is
          # exactly what killed both macOS jobs on the first run. An unsigned
          # macOS build would not be usable by anyone anyway.
          # Windows is off for this release at the operator's request — it is
          # being checked on a real Windows machine separately. Restore these
          # three lines to build it again; nothing else depends on them.
          # - name: Windows
          #   os: windows-latest
          #   args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    # Without this the whole build succeeds and then throws it away. `tauri-action`
    # uploads to the release with `GITHUB_TOKEN`, and this repository's default
    # workflow token is read-only — so Linux bundled a .deb, an .rpm and an
    # AppImage, and died on the first upload with "Resource not accessible by
    # integration", which reads as a packaging failure and is not one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # WebKitGTK and its friends. Ubuntu 22.04 rather than latest on purpose:
      # a binary built against an older glibc runs on newer distributions, and
      # the reverse is the "GLIBC_2.39 not found" that makes a release useless
      # to exactly the servers most worth installing on.
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      # No `version:` here — `package.json` already pins pnpm through
      # `packageManager`, and the action refuses when both are set rather than
      # picking one. Letting the manifest be the single source also means CI
      # cannot drift from what a developer runs locally.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same agents on every platform — see the note at the top.
      - uses: actions/download-artifact@v4
        with:
          name: agents
          path: src-tauri/agents

      - name: Make the agents executable
        if: matrix.os != 'windows-latest'
        run: chmod +x src-tauri/agents/*

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: rmux ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
