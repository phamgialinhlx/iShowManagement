[package]
name = "rmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "rmux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rmux-transport.workspace = true
rmux-ssh.workspace = true
rmux-cowork.workspace = true
rmux-term.workspace = true
rmux-agent.workspace = true
keyring.workspace = true
rmux-fs.workspace = true
rmux-metrics.workspace = true
rmux-claude.workspace = true

anyhow.workspace = true
camino.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
# `protocol-asset` is required by the `assetProtocol` block in tauri.conf.json —
# the build script refuses to proceed if the two disagree. It is what lets the
# webview load the downloaded face models off disk.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json.workspace = true
